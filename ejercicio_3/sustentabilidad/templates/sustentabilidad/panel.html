<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Sustentabilidad - EcoTech Solutions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f8f4; color: #222; }
        h1 { color: #2e7d32; }
        .tarjeta { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 1px 4px #ccc; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #2e7d32; color: white; }
    </style>
</head>
<body>
    <h1>Panel de Sustentabilidad</h1>

    <div class="tarjeta">
        <h2>Total global de emisiones</h2>
        <p>{{ total_emisiones }} kg CO2</p>
    </div>

    <div class="tarjeta">
        <h2>Planta de mayor consumo</h2>
        <p>{{ planta_top }}</p>
    </div>

    <div class="tarjeta">
        <h2>Consumo por planta</h2>
        <table>
            <tr>
                <th>Planta</th>
                <th>Consumo (kWh)</th>
            </tr>
            {% for planta, consumo in consumo_por_planta.items %}
            <tr>
                <td>{{ planta }}</td>
                <td>{{ consumo }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
